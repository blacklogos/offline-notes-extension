<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Notes</title>
  <link rel="stylesheet" href="../lib/tokens.css">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>
        <span class="brand-glyph" data-icon="notebook"></span>
        My Notes
      </h1>
      <nav class="tab-strip" role="tablist" aria-label="Note type">
        <button class="tab-btn active" role="tab" data-tab="notes" aria-selected="true">Notes</button>
        <button class="tab-btn" role="tab" data-tab="pages" aria-selected="false">Pages</button>
      </nav>
      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" title="Switch theme" aria-label="Switch theme">Aa</button>
        <button id="exportAllMd" class="icon-btn" title="Export all notes to Markdown" data-icon="copy"></button>
      </div>
    </header>

    <!-- Notes tab panel -->
    <section class="tab-panel active" data-panel="notes" role="tabpanel">
      <div class="search-bar">
        <span class="search-icon" data-icon="search"></span>
        <input type="text" id="searchInput" placeholder="Search notes…" aria-label="Search notes">
        <details id="tagMenu" class="tag-menu hidden">
          <summary><span id="tagSummary">Tags</span><span class="disclosure-icon" data-icon="chevronRight" aria-hidden="true"></span></summary>
          <div id="tagFilter" class="tag-filter hidden" role="group" aria-label="Filter by tag"></div>
        </details>
      </div>

      <div id="notesList" class="notes-list"></div>

      <div id="emptyState" class="empty-state hidden">
        <img class="empty-illo" src="../images/empty-states/notes-empty.svg" alt="" width="120" height="120">
        <h3>No notes yet</h3>
        <p>Press <kbd>Alt+N</kbd> or click the extension icon to start.</p>
      </div>

      <div id="searchEmptyState" class="empty-state hidden">
        <img class="empty-illo" src="../images/empty-states/search-empty.svg" alt="" width="120" height="120">
        <h3>No matching notes</h3>
        <p id="searchEmptyText">Try a different search term.</p>
      </div>
    </section>

    <!-- Pages tab panel -->
    <section class="tab-panel" data-panel="pages" role="tabpanel" hidden>
      <div id="pagesList" class="pages-list"></div>

      <div id="pagesEmptyState" class="empty-state hidden">
        <img class="empty-illo" src="../images/empty-states/pages-empty.svg" alt="" width="120" height="120">
        <h3>No saved highlights yet</h3>
        <p>Select text on any page, then click the <strong>Save</strong> bubble or press <kbd>Alt+H</kbd>.</p>
      </div>
    </section>
    <details id="vaultBar" class="vault-bar hidden">
      <summary>
        <span class="vault-icon" data-icon="notebook" aria-hidden="true"></span>
        <span id="vaultStatus" class="vault-status" role="status">Not connected</span>
        <span class="vault-label">Vault</span>
        <span class="disclosure-icon" data-icon="chevronRight" aria-hidden="true"></span>
      </summary>
      <div class="vault-controls">
        <button id="vaultAction" class="btn btn-secondary btn-sm">Choose folder</button>
        <button id="vaultForget" class="btn-link hidden" title="Stop writing to this folder">Forget</button>
      </div>
    </details>
  </div>

  <!-- Note edit modal -->
  <div id="noteModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <input type="text" id="modalTitle" class="modal-title-input" placeholder="Note title…">
        <button id="closeModal" class="icon-btn" data-icon="x"></button>
      </div>

      <textarea id="modalContent" class="modal-textarea" placeholder="Write your note here…"></textarea>

      <div class="modal-tags">
        <input type="text" id="modalTags" placeholder="Tags (comma separated)…">
      </div>

      <div class="modal-actions">
        <div class="action-group">
          <select id="templateSelect" class="template-select">
            <option value="paper-default">Paper · Default</option>
            <option value="paper-minimal">Paper · Minimal</option>
            <option value="paper-quote">Paper · Quote</option>
            <option value="paper-card">Paper · Card</option>
            <option value="paper-letterhead">Paper · Letterhead</option>
          </select>
          <button id="generateImage" class="btn btn-secondary">
            <span data-icon="sparkle"></span>
            Create image
          </button>
          <button id="exportMd" class="btn btn-secondary">
            <span data-icon="copy"></span>
            Export MD
          </button>
        </div>
        <div class="action-group">
          <button id="deleteNote" class="btn btn-danger">
            <span data-icon="trash"></span>
            Delete
          </button>
          <button id="saveNote" class="btn btn-primary">
            <span data-icon="check"></span>
            Save
          </button>
        </div>
      </div>

      <div class="modal-footer">
        <small id="noteMetadata"></small>
      </div>
    </div>
  </div>

  <!-- Page note detail modal -->
  <div id="pageModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <input type="text" id="pageModalTitle" class="modal-title-input" placeholder="Page title…">
        <button id="closePageModal" class="icon-btn" data-icon="x"></button>
      </div>

      <div class="page-source">
        <a id="pageSourceLink" href="#" target="_blank" rel="noopener noreferrer"></a>
        <button id="copyPageUrl" class="icon-btn" title="Copy URL" data-icon="link"></button>
      </div>

      <details id="readerPanel" class="reader-panel hidden">
        <summary>
          <span id="readerSummary">Saved article</span>
          <span class="disclosure-icon" data-icon="chevronRight" aria-hidden="true"></span>
        </summary>
        <div id="readerMeta" class="reader-meta"></div>
        <div id="readerBody" class="reader-body"></div>
        <button id="clearSavedContent" class="btn-link">Remove saved text</button>
      </details>

      <div class="highlight-toolbar">
        <label><input type="checkbox" class="hl-checkbox" id="selectAllHighlights"> Select all</label>
        <span class="spacer"></span>
        <button id="exportPageMd" class="btn btn-secondary btn-sm" title="Export selected highlights as Markdown">
          <span data-icon="copy"></span>Export MD
        </button>
        <button id="copyPageMd" class="btn btn-secondary btn-sm" title="Copy selected highlights as Markdown">
          <span data-icon="copy"></span>Copy all
        </button>
      </div>
      <div id="pageHighlights" class="page-highlights"></div>

      <div class="modal-actions">
        <div class="action-group">
          <button id="deletePageNote" class="btn btn-danger">
            <span data-icon="trash"></span>
            Delete page note
          </button>
        </div>
        <div class="action-group">
          <small id="pageMetadata" class="page-metadata"></small>
        </div>
      </div>
    </div>
  </div>

  <script src="../lib/html2canvas.min.js"></script>
  <script src="../lib/theme.js"></script>
  <script src="../lib/icons.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/url-canonical.js"></script>
  <script src="../lib/page-storage.js"></script>
  <script src="../lib/markdown.js"></script>
  <script src="../lib/templates.js"></script>
  <script src="../lib/image-generator.js"></script>
  <script src="../lib/page-note-export.js"></script>
  <script src="../lib/vault.js"></script>
  <script src="sidebar.js"></script>
</body>
</html>
