<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template Preview — paper-* family</title>
  <link rel="stylesheet" href="lib/tokens.css">
  <style>
    body {
      margin: 0;
      padding: var(--space-6);
      background: var(--paper-100);
      color: var(--ink-900);
      font-family: var(--font-sans);
      font-size: var(--text-14);
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 { font-size: var(--text-20); font-weight: var(--weight-bold); margin: 0 0 var(--space-2); }
    .controls { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: var(--space-4) 0; }
    button {
      background: var(--sage-700); color: var(--paper-50);
      border: none; padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-md);
      font: inherit; font-weight: var(--weight-semibold);
      cursor: pointer; transition: background var(--motion-fast) var(--ease-out);
    }
    button:hover { background: var(--ink-700); }
    button.secondary { background: var(--paper-200); color: var(--ink-900); }
    button.secondary:hover { background: var(--paper-300); }
    #preview {
      margin-top: var(--space-4);
      padding: var(--space-4);
      background: var(--warm-grey-100);
      border: 1px dashed var(--paper-300);
      border-radius: var(--radius-md);
      overflow: auto;
    }
    .meta { color: var(--ink-700); font-size: var(--text-12); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Template preview — paper-* family</h1>
    <p class="meta">Click a template to render it with sample data. Generate to rasterize via html2canvas; download saves PNG.</p>

    <div class="controls" id="template-buttons"></div>

    <div class="controls">
      <button onclick="generateImage()">Generate image (PNG)</button>
      <button class="secondary" onclick="downloadImage()">Download PNG</button>
    </div>

    <div id="preview"></div>
  </div>

  <script src="lib/html2canvas.min.js"></script>
  <script src="lib/templates.js"></script>
  <script>
    const templateManager = new TemplateManager();
    let currentTemplate = 'paper-default';
    let currentCanvas = null;

    const sampleNote = {
      title: 'On finishing things',
      content: 'A finished feature that ships beats a perfect feature that does not.\n\nThe goal is the work in front of you, not the architecture diagram of work that might one day exist.',
      tags: ['craft', 'shipping', 'notes'],
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };

    function renderTemplateButtons() {
      const host = document.getElementById('template-buttons');
      templateManager.getTemplateNames().forEach((name) => {
        const btn = document.createElement('button');
        btn.textContent = name;
        btn.className = 'secondary';
        btn.onclick = () => testTemplate(name);
        host.appendChild(btn);
      });
    }

    function testTemplate(name) {
      currentTemplate = name;
      const html = templateManager.getTemplate(name, sampleNote);
      document.getElementById('preview').innerHTML = html;
      currentCanvas = null;
    }

    async function generateImage() {
      const previewElement = document.getElementById('preview').firstElementChild?.nextElementSibling
        || document.getElementById('preview').firstElementChild;
      // Skip the inlined <style> tag and render the actual template <div>.
      const target = Array.from(document.getElementById('preview').children).find((el) => el.tagName === 'DIV');
      if (!target) { alert('Pick a template first.'); return; }
      try {
        currentCanvas = await html2canvas(target, {
          backgroundColor: null, scale: 2, logging: false, useCORS: true, allowTaint: true,
        });
        const wrap = document.createElement('div');
        wrap.style.marginTop = 'var(--space-4)';
        wrap.innerHTML = '<h3 style="font-size: var(--text-16); margin: 0 0 var(--space-2);">Rasterized output:</h3>';
        currentCanvas.style.maxWidth = '100%';
        wrap.appendChild(currentCanvas);
        document.getElementById('preview').appendChild(wrap);
      } catch (err) {
        console.error(err);
        alert('Error: ' + err.message);
      }
    }

    function downloadImage() {
      if (!currentCanvas) { alert('Generate an image first.'); return; }
      currentCanvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `note-${currentTemplate}-${Date.now()}.png`;
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    renderTemplateButtons();
    testTemplate('paper-default');
  </script>
</body>
</html>
