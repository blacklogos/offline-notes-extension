<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Note</title>
  <link rel="stylesheet" href="../lib/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>
        <span class="brand-glyph" data-icon="notebook"></span>
        Quick Note
      </h1>
      <button id="openSidebar" class="icon-btn" title="Open full notes manager" data-icon="chevronRight"></button>
    </header>

    <form id="noteForm">
      <textarea
        id="noteContent"
        placeholder="Write a note…"
        aria-label="Note content"
        aria-describedby="formatHint"
        rows="7"
        autocomplete="off"
      ></textarea>

      <div class="note-options">
        <label for="noteTitle">Title</label>
        <input
          type="text"
          id="noteTitle"
          placeholder="From first line"
          aria-label="Title (optional)"
          autocomplete="off"
          maxlength="100"
        >

        <label for="tagInput">Tags</label>
        <input
          type="text"
          id="tagInput"
          placeholder="Add tags, comma separated"
          aria-label="Tags (optional, comma separated)"
          autocomplete="off"
        >
      </div>

      <div class="button-group">
        <span id="formatHint" class="format-hint">Markdown supported</span>
        <button type="submit" class="btn btn-primary">
          <span data-icon="check"></span>
          Save note
        </button>
        <button type="button" id="clearBtn" class="btn btn-secondary">Clear</button>
      </div>
    </form>

    <footer class="footer">
      <span id="noteCount">0 notes</span>
      <span class="separator">·</span>
      <span>Stored locally</span>
      <span id="successMessage" class="success-message hidden" role="status">
        <span data-icon="check"></span>
        Saved
      </span>
    </footer>
  </div>

  <script src="../lib/icons.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
