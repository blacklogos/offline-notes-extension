<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Note</title>
  <link rel="stylesheet" href="../lib/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>
        <span class="brand-glyph" data-icon="notebook"></span>
        Quick Note
      </h1>
      <button id="openSidebar" class="icon-btn" title="Open full notes manager" data-icon="chevronRight"></button>
    </header>

    <form id="noteForm">
      <textarea
        id="noteContent"
        placeholder="Write your note here…&#10;Supports markdown — **bold** *italic* `code`"
        rows="8"
        autocomplete="off"
      ></textarea>

      <input
        type="text"
        id="noteTitle"
        placeholder="Title (optional) — taken from the first line if left blank"
        autocomplete="off"
        maxlength="100"
      >

      <div class="tags-input">
        <input
          type="text"
          id="tagInput"
          placeholder="Tags (optional), comma separated…"
          autocomplete="off"
        >
      </div>

      <div class="button-group">
        <button type="submit" class="btn btn-primary">
          <span data-icon="check"></span>
          Save note
        </button>
        <button type="button" id="clearBtn" class="btn btn-secondary">Clear</button>
      </div>
    </form>

    <div id="successMessage" class="success-message hidden">
      <span data-icon="check"></span>
      Saved
    </div>

    <footer class="footer">
      <span id="noteCount">0 notes</span>
      <span class="separator">·</span>
      <span>Stored locally</span>
    </footer>
  </div>

  <script src="../lib/icons.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
